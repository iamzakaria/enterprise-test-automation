[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-test-automation"
version = "0.1.0"
description = "A reproducible Playwright and Pytest quality engineering foundation"
requires-python = ">=3.12"
dependencies = ["pytest>=8,<10", "pytest-playwright>=0.7,<1", "allure-pytest>=2.13,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --alluredir=artifacts/allure-results --clean-alluredir --output=artifacts/playwright --tracing=retain-on-failure --screenshot=only-on-failure"
markers = ["smoke: critical application journeys"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
